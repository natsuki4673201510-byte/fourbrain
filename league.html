<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リーグID取り込み</title>
<style>
  :root {
    --bg: #f6f6f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #dcdce0;
    --accent: #fe2c55; --ok: #1a7f37; --warn: #b26a00; --chip: #f0f0f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --card: #1c1c1f; --text: #f2f2f3; --muted: #9a9aa0; --line: #33333a;
      --accent: #ff4d70; --ok: #3fb950; --warn: #e3a008; --chip: #2a2a2f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, button { font: inherit; color: inherit; }
  input[type=text], input[type=password], input[type=date], select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  button { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; white-space: pre-wrap; }
  .status.err { color: var(--accent); }
  .row { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .rank { font-size: 18px; font-weight: 700; text-align: center; padding-top: 4px; }
  .row canvas { width: 100%; max-width: 420px; height: auto; border-radius: 6px; display: block; background: var(--chip); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
  .name { font-weight: 600; }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 99px; background: var(--chip); color: var(--muted); }
  .badge.auto { color: var(--ok); }
  .badge.manual { color: var(--warn); }
  .idline { display: flex; gap: 8px; }
  .idline input { flex: 1; }
  .idline a { white-space: nowrap; align-self: center; color: var(--accent); font-size: 13px; }
  .sticky { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .count { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>リーグID取り込み</h1>

  <div class="card grid">
    <div><label>合言葉</label><input type="password" id="pass" autocomplete="current-password"></div>
    <div><label>日付（タブ名）</label><input type="date" id="date"></div>
    <div><label>リーグ</label><select id="league"></select></div>
  </div>

  <div class="card">
    <div class="drop" id="drop">ここにスクショをドロップ（複数可）<br>またはタップして選択 / Ctrl+Vで貼り付け</div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="listCard" hidden>
    <div id="list"></div>
  </div>

  <div class="sticky" id="actions" hidden>
    <button class="primary" id="save">シートに書き込む</button>
    <button id="clear">クリア</button>
    <span class="count" id="count"></span>
  </div>
</main>

<script>
(function () {
  var LEAGUES = ['D5','D4','D3','D2','D1','C5','C4','C3','C2','C1','B5','B4','B3','B2','B1'];
  var MAX_SIDE = 1800;

  var $ = function (id) { return document.getElementById(id); };
  var state = { rows: {}, dict: null };   // rows: rank -> {rank,name,coins,canvas,id,source}

  function store(key, val) {
    try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
  }

  // 初期値
  LEAGUES.forEach(function (l) { var o = document.createElement('option'); o.value = o.textContent = l; $('league').appendChild(o); });
  $('league').value = store('league') || 'D5';
  $('pass').value = store('pass') || '';
  var y = new Date(); y.setDate(y.getDate() - 1);
  $('date').value = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  $('pass').addEventListener('change', function () {
    if (store('pass') !== $('pass').value) state.dict = null;  // 合言葉が変わったら辞書を読み直す
    store('pass', $('pass').value);
  });
  $('league').addEventListener('change', function () { store('league', $('league').value); });

  function setStatus(msg, isErr) { $('status').textContent = msg; $('status').className = 'status' + (isErr ? ' err' : ''); }
  function norm(s) { return String(s || '').normalize('NFKC').replace(/\s+/g, ' ').trim(); }
  function cleanId(s) {
    return String(s || '').trim().replace(/^https?:\/\/(www\.)?tiktok\.com\//, '').replace(/^@/, '').replace(/[/?#].*$/, '');
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'x-app-passcode': $('pass').value }, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return { error: 'HTTP ' + r.status }; }).then(function (d) {
        if (!r.ok || d.error) throw new Error(d.error || ('HTTP ' + r.status));
        return d;
      });
    });
  }

  function loadDict() {
    if (state.dict) return Promise.resolve(state.dict);
    return api('/api/league/sheet').then(function (d) { state.dict = d.dict || {}; return state.dict; });
  }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('画像を開けません: ' + file.name)); };
      img.src = url;
    });
  }

  function cropRow(src, top, bottom) {
    var t = Math.max(0, Math.min(1, top)), b = Math.max(0, Math.min(1, bottom));
    if (b <= t) b = Math.min(1, t + 0.06);
    var pad = (b - t) * 0.15;
    var y0 = Math.max(0, Math.floor((t - pad) * src.height));
    var h = Math.max(1, Math.min(src.height, Math.ceil((b + pad) * src.height)) - y0);
    var c = document.createElement('canvas');
    c.width = src.width; c.height = h;
    c.getContext('2d').drawImage(src, 0, y0, src.width, h, 0, 0, src.width, h);
    return c;
  }

  function handleFiles(files) {
    files = Array.prototype.filter.call(files, function (f) { return /^image\//.test(f.type); });
    if (!files.length) return;
    if (!$('pass').value) { setStatus('合言葉を入れてください', true); return; }
    store('pass', $('pass').value);

    var done = 0, errors = [];
    setStatus('読み取り中… 0/' + files.length);
    var chain = loadDict().catch(function (e) { errors.push('辞書: ' + e.message); state.dict = {}; });

    files.forEach(function (file) {
      chain = chain.then(function () {
        return loadImage(file).then(function (canvas) {
          var data = canvas.toDataURL('image/jpeg', 0.88).split(',')[1];
          return api('/api/league/read', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ image: data, mediaType: 'image/jpeg' })
          }).then(function (res) {
            if (res.league && LEAGUES.indexOf(res.league.toUpperCase()) >= 0 && !Object.keys(state.rows).length) {
              $('league').value = res.league.toUpperCase();
            }
            (res.rows || []).forEach(function (r) {
              if (!(r.rank >= 1 && r.rank <= 99) || state.rows[r.rank]) return;
              var known = state.dict[norm(r.name)];
              state.rows[r.rank] = {
                rank: r.rank, name: r.name, coins: r.coins,
                canvas: cropRow(canvas, r.top, r.bottom),
                id: known || '', source: known ? 'auto' : ''
              };
            });
          });
        }).catch(function (e) { errors.push(file.name + ': ' + e.message); })
          .then(function () { done++; setStatus('読み取り中… ' + done + '/' + files.length); render(); });
      });
    });

    chain.then(function () {
      var n = Object.keys(state.rows).length;
      setStatus(n + '人分を読み取りました。' + (errors.length ? '\n' + errors.join('\n') : ''), errors.length > 0);
    });
  }

  function render() {
    var ranks = Object.keys(state.rows).map(Number).sort(function (a, b) { return a - b; });
    $('listCard').hidden = $('actions').hidden = ranks.length === 0;
    var list = $('list');
    list.innerHTML = '';
    ranks.forEach(function (rank) {
      var r = state.rows[rank];
      var row = document.createElement('div'); row.className = 'row';
      var rk = document.createElement('div'); rk.className = 'rank'; rk.textContent = rank;
      var body = document.createElement('div');
      body.appendChild(r.canvas);

      var meta = document.createElement('div'); meta.className = 'meta';
      var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = r.name;
      var coins = document.createElement('span'); coins.className = 'badge'; coins.textContent = r.coins;
      meta.appendChild(nm); meta.appendChild(coins);
      if (r.source === 'auto') { var b = document.createElement('span'); b.className = 'badge auto'; b.textContent = '辞書から自動'; meta.appendChild(b); }

      var line = document.createElement('div'); line.className = 'idline';
      var input = document.createElement('input'); input.type = 'text'; input.placeholder = 'ID（分からなければ空欄）'; input.value = r.id;
      input.addEventListener('input', function () { r.id = cleanId(input.value); r.source = r.id ? 'manual' : ''; updateCount(); });
      input.addEventListener('blur', function () { input.value = r.id; });
      var link = document.createElement('a');
      link.href = 'https://www.tiktok.com/search/user?q=' + encodeURIComponent(r.name);
      link.target = '_blank'; link.rel = 'noopener'; link.textContent = 'TikTokで検索';
      line.appendChild(input); line.appendChild(link);

      body.appendChild(meta); body.appendChild(line);
      row.appendChild(rk); row.appendChild(body);
      list.appendChild(row);
    });
    updateCount();
  }

  function updateCount() {
    var all = Object.keys(state.rows).length;
    var filled = Object.keys(state.rows).filter(function (k) { return state.rows[k].id; }).length;
    $('count').textContent = 'ID入力済み ' + filled + ' / ' + all + '人';
  }

  $('save').addEventListener('click', function () {
    var league = $('league').value, date = $('date').value;
    if (!date) { setStatus('日付を入れてください', true); return; }
    var rows = [], dict = [], known = state.dict || {};
    Object.keys(state.rows).forEach(function (k) {
      var r = state.rows[k];
      if (!r.id) return;
      rows.push({ rank: r.rank, id: r.id });
      if (known[norm(r.name)] !== r.id) dict.push({ name: r.name, id: r.id });
    });
    if (!confirm(date + ' のタブ / ' + league + ' 列に ' + rows.length + '件書き込みます（この列は上書き）。よろしいですか？')) return;

    $('save').disabled = true;
    setStatus('書き込み中…');
    api('/api/league/sheet', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ date: date, league: league, rows: rows, dict: dict })
    }).then(function (d) {
      if (state.dict) dict.forEach(function (e) { state.dict[norm(e.name)] = e.id; });
      state.rows = {};
      render();
      var next = LEAGUES[LEAGUES.indexOf(league) + 1];
      if (next) { $('league').value = next; store('league', next); }
      setStatus('✓ ' + league + ' に ' + d.written + '件書き込みました。' + (next ? '次は ' + next + ' のスクショをどうぞ。' : 'B1まで完了です。'));
    }).catch(function (e) {
      setStatus('書き込み失敗: ' + e.message, true);
    }).then(function () { $('save').disabled = false; });
  });

  $('clear').addEventListener('click', function () {
    if (confirm('読み取り結果をクリアしますか？')) { state.rows = {}; render(); setStatus(''); }
  });

  // 画像の受け取り（クリック・ドロップ・貼り付け）
  var drop = $('drop');
  drop.addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function (e) { handleFiles(e.target.files); e.target.value = ''; });
  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
  drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('over'); handleFiles(e.dataTransfer.files); });
  document.addEventListener('paste', function (e) {
    var files = [];
    Array.prototype.forEach.call((e.clipboardData && e.clipboardData.items) || [], function (it) {
      if (it.kind === 'file') { var f = it.getAsFile(); if (f) files.push(f); }
    });
    if (files.length) handleFiles(files);
  });
})();
</script>
</body>
</html>
